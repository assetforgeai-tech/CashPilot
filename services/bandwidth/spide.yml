name: Spide
slug: spide
category: bandwidth
status: active
website: https://spide.network
description: >
  Spide is a bandwidth-sharing service that lets you monetize unused internet
  bandwidth. Uses an optional machine ID for device tracking. Available through
  community Docker images from the income-generator project.
short_description: Bandwidth sharing - machine ID based

referral:
  signup_url: "https://spide.network/register.html?f3bc51"
  code: "f3bc51"

docker:
  image: alpine:3.20
  platforms: [linux/amd64]
  resources:
    mem_limit: "256m"
    oom_score_adj: 300
  env: []
  ports: []
  volumes:
    - "spide-data:/data/spide"
  command: >-
    sh -ec 'set -eu;
    apk add --no-cache ca-certificates curl unzip >/dev/null;
    mkdir -p /data/spide;
    if [ ! -s /data/spide/machine-id ]; then tr -d - < /proc/sys/kernel/random/uuid > /data/spide/machine-id; fi;
    cp /data/spide/machine-id /etc/machine-id;
    if [ ! -x /data/spide/spide_linux_cli ]; then
      curl -fsSL -o /tmp/spide_linux_cli.zip https://config-alpha-01.sgp1.digitaloceanspaces.com/spide_linux_cli.zip;
      unzip -t /tmp/spide_linux_cli.zip >/dev/null;
      unzip -o /tmp/spide_linux_cli.zip -d /data/spide >/dev/null;
    fi;
    exe="$(find /data/spide -maxdepth 2 -type f -perm -111 | head -n 1)";
    exec "$exe"'
  network_mode: ""

deploy:
  automation: device_key_register
  deploy_surface: host_systemd
  notes: "Download and run the official Linux CLI zip, parse the Device key from stdout, then register it in the dashboard."
  credentials:
    - key: email
      label: "Email"
      kind: email
      secret: false
      required: true
      source: "Spide account"
      description: "Account email used to log in and create a device registration token."
    - key: password
      label: "Password"
      kind: password
      secret: true
      required: true
      source: "Spide account"
      description: "Account password used to log in and create a device registration token."

dashboard:
  credentials:
    - key: dashboard_token
      label: "Dashboard token"
      kind: token
      secret: true
      required: true
      source: "Spide logged-in dashboard request token/cookie"
      description: "Token/cookie used only to register CLI Device key through POST /api/v1/device/create."

requirements:
  residential_ip: true
  vps_ip: false
  devices_per_ip: 1
  note: "Traffic through one public IP is split between the devices sharing it, so a second device on the same connection adds nothing."
  note_column: devices_per_ip
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: "$5"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 3
  currency: USD
  per: "device"
  notes: "Limited information available. Earnings depend on location."

cashout:
  method: redirect
  dashboard_url: "https://spide.network/dashboard"
  min_amount: 5.0
  currency: USD

platforms: [windows, linux]

collector:
  type: manual
  notes: "No official Docker image or public API found."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."
