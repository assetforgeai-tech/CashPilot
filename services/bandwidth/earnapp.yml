name: EarnApp
slug: earnapp
category: bandwidth
status: active
website: https://earnapp.com
description: >
  EarnApp by Bright Data lets residential devices earn from contributed network
  usage. Its official model is now fixed-rate pay-per-time, not pay-per-GB.
  Official support prohibits VM, Docker, hosting, personal/home server, and
  business/monetization environments, so the community Docker image is a
  known account-risk path rather than the provider's intended setup.
short_description: Bandwidth sharing - pay-per-time, Docker prohibited

referral:
  signup_url: "https://earnapp.com/i/TSMD9wSm"
  code: "TSMD9wSm"

docker:
  image: fazalfarhan01/earnapp:lite
  platforms: [linux/amd64]
  resources:
    mem_limit: "256m"
    oom_score_adj: 300
  env:
    - key: EARNAPP_TERM
      label: "Accept Terms"
      required: false
      secret: false
      description: "Set to 'yes' to accept terms of service"
      default: "yes"
  ports: []
  volumes:
    - "earnapp-data:/etc/earnapp"
  command: ""
  network_mode: ""
  privileged: false

deploy:
  credentials:
    - key: oauth_refresh_token
      label: "OAuth refresh token"
      kind: token
      secret: true
      required: true
      source: "EarnApp logged-in browser cookie"
      description: "oauth-refresh-token cookie used by the node link flow."
    - key: oauth_token
      label: "OAuth token"
      kind: token
      secret: true
      required: true
      source: "EarnApp logged-in browser cookie"
      description: "oauth-token cookie used by the node link flow."
    - key: xsrf_token
      label: "XSRF token"
      kind: token
      secret: true
      required: true
      source: "EarnApp logged-in browser cookie"
      description: "xsrf-token cookie used by the node link flow."
    - key: brd_sess_id
      label: "BRD session ID"
      kind: token
      secret: true
      required: true
      source: "EarnApp logged-in browser cookie"
      description: "brd_sess_id cookie used by the node link flow."
    - key: cg_uuid
      label: "CG UUID"
      kind: text
      secret: false
      required: true
      source: "EarnApp logged-in browser cookie"
      description: "cg_uuid cookie used by the node link flow."

requirements:
  residential_ip: true
  vps_ip: false
  container_prohibited: true
  devices_per_account: 15
  min_bandwidth: "10 Mbps recommended; 100 Mbps recommended for US max rate"
  gpu: false
  min_storage: ""

payment:
  methods: [paypal, amazon_giftcard, wise]
  minimum_payout: "$10"
  currency: USD
  frequency: "On request (auto-redeem available: PayPal $10 min, Wise $10 min, Amazon $50 min)"

earnings:
  monthly_low: 0
  monthly_high: 10
  currency: USD
  per: "device"
  notes: "Official rates are pay-per-time: up to $10/IP/month in the US and up to $5/IP/month elsewhere, depending on active use and demand."

cashout:
  method: redirect
  dashboard_url: "https://earnapp.com/dashboard/cashout"
  min_amount: 10.0
  currency: USD

platforms: [docker, windows, macos, linux, android, ios]

collector:
  type: api
  credentials:
    - key: oauth_token
      label: "OAuth refresh token"
      kind: token
      secret: true
      required: true
      source: "EarnApp logged-in browser cookie"
      description: "oauth-refresh-token cookie used by the earnings collector."
  notes: "Dashboard API at /dashboard/api/money/. Auth via OAuth refresh token cookie. Returns balance in USD."
  credential_hint: "Log in at <a href='https://earnapp.com' target='_blank'>earnapp.com</a>, press F12 → Application → Cookies, copy the <b>oauth-refresh-token</b> value."

payout:
  model: internal
  notes: "Balance held by EarnApp; redeemed to Amazon/Wise/PayPal."
