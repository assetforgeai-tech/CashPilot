name: EarnApp
slug: earnapp
category: bandwidth
status: active
website: https://earnapp.com
description: >
  EarnApp proxy-only runtime with account-scoped identity and an explicit
  platform-aware canary lane. VN residential egress selects MacOS or iOS;
  non-VN residential egress selects the official Ubuntu runtime in LXD. Each
  node owns one exclusive residential proxy.
short_description: Proxy-only EarnApp runtime with platform-aware canary provisioning

docker:
  image: cashpilot/earnapp-mac-canary:asset-4a1e80cbb95d
  platforms: [linux/amd64]
  env: []
  ports: []
  volumes:
    - "earnapp-${EARNAPP_LOGICAL_NODE_ID}-data:/etc/earnapp"
  critical_volumes:
    - target: "/etc/earnapp"
      holds: >-
        EarnApp device identity and registration state. Destroying it creates a
        different device and must never happen during a normal redeploy.
  command: ""
  network_mode: ""
  privileged: false
  cap_add: [NET_ADMIN]
  devices: []
  resources:
    mem_limit: "1g"
    oom_score_adj: 200

deploy:
  automation: earnapp_platform_nodes
  existing_node_policy: immutable
  platform_routes:
    - platform: macos
      country_policy: VN
      runtime_backend: docker
      asset_kind: mac_identity_profile
    - platform: ios
      country_policy: VN
      runtime_backend: docker
      asset_kind: ios_identity_profile
    - platform: ubuntu
      country_policy: non-VN
      runtime_backend: lxd
      asset_kind: ubuntu_identity_profile
  credentials: []

egress:
  mode: proxy
  udp: none
  reason: >-
    EarnApp nodes use one account-scoped, exclusive residential proxy through
    the existing CashPilot sing-box sidecar. The worker public IP is not used.

requirements:
  residential_ip: true
  vps_ip: false
  devices_per_ip: 1
  min_bandwidth: ""
  gpu: false
  min_storage: ""

platforms: [docker, linux, macos, ios]

collector:
  type: account_pool
  per_node_earnings: false
  credentials: []
  notes: "Account-scoped collector uses the EarnApp Account Pool and one of that account's node proxies."

payment:
  methods: [paypal, crypto]
  minimum_payout: "$2"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 0
  currency: USD
  per: device
  notes: "Earnings are account-level; node status is verified separately from active devices."

payout:
  model: external
  notes: "EarnApp pays the linked account directly."
