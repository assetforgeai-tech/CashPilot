name: URnetwork
slug: urnetwork
category: bandwidth
status: active
website: https://ur.io
description: >
  URnetwork is a decentralized VPN and bandwidth-sharing network. You earn by
  providing bandwidth as a community provider. Uses JWT-based authentication.
  Official Docker image from Bring Your Own (bringyour). Supports both direct
  mode (with tun device) and proxy mode (SOCKS5).
short_description: Decentralized VPN/bandwidth - JWT auth, direct or proxy mode

referral:
  signup_url: "https://ur.io/?referral_code=1Q3G19"
  code: "1Q3G19"

docker:
  image: bringyour/community-provider
  platforms: [linux/amd64, linux/arm64]
  resources:
    mem_limit: "128m"
    oom_score_adj: 300
  env: []
  ports: []
  volumes:
    - "urnetwork-data:/root/.urnetwork"
  command: "provide"
  network_mode: ""

deploy:
  credentials:
    - key: auth_token
      label: "UR_AUTH_TOKEN"
      kind: token
      secret: true
      required: true
      source: "https://app.ur.network Account Settings / auth token"
      description: "Worker runtime token for the bringyour/community-provider container. CashPilot forwards it as UR_AUTH_TOKEN."

requirements:
  residential_ip: false
  vps_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: "$5"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 5
  currency: USD
  per: "device"
  notes: "Works on VPS and residential. Crypto payouts. Supports proxy mode for multi-IP setups."

cashout:
  method: redirect
  dashboard_url: "https://app.ur.network/wallet-stats"
  min_amount: 5.0
  currency: USD

platforms: [docker, windows, macos, linux]

collector:
  type: manual
  credentials:
    - key: api_key
      label: "URNetwork API key"
      kind: api_key
      secret: true
      required: false
      source: "https://app.ur.network Account Settings > API Key Management"
      description: "Optional future collector credential. Leave empty until CashPilot confirms the API response shape."
  notes: "Logged-in client manager exposes Clients, Statistics, Providers, Wallet Stats, Account Settings, Balance Codes, and API Key Management. No collector/API response shape is confirmed yet."

payout:
  model: external
  chain: solana
  address_source: app
  notes: "Wallet is linked inside the URnetwork app. AN UNLINKED WALLET FORFEITS PAYOUT AFTER 30 DAYS."
