name: Earn.fm
slug: earnfm
category: bandwidth
status: active
website: https://earn.fm
description: >
  Earn.fm pays you for sharing your internet bandwidth. The deployable client
  uses a UUID API key from More -> Your API Key. The dashboard shows
  residential, datacenter, referral, pending, and available earnings buckets.
short_description: Bandwidth sharing - API-key client, lightweight Docker

referral:
  signup_url: "https://earn.fm/ref/GEISYB91"
  code: "GEISYB91"

docker:
  image: earnfm/earnfm-client
  platforms: [linux/amd64, linux/arm64]
  resources:
    mem_limit: "128m"
    oom_score_adj: 200
  env:
    - key: EARNFM_TOKEN
      label: "API Key"
      required: true
      secret: true
      description: "Log in at <a href=\"https://app.earn.fm\">app.earn.fm</a> -> click More -> Your API Key -> copy the UUID API key"
  ports: []
  volumes: []
  command: ""
  network_mode: ""
  privileged: false

deploy:
  credentials:
    - key: token
      label: "API Key"
      kind: api_key
      secret: true
      required: true
      env: EARNFM_TOKEN
      source: "Earn.fm dashboard -> More -> Your API Key"
      description: "UUID API key used by the Earn.fm Docker client."

requirements:
  residential_ip: true
  vps_ip: true
  devices_per_ip: 1
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: "$3"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 3
  currency: USD
  per: "device"
  notes: "Relatively new platform. Earnings vary by location and bandwidth availability."

cashout:
  method: redirect
  dashboard_url: "https://app.earn.fm/#/payout"
  min_amount: 3.0
  currency: USD

platforms: [docker, linux]

collector:
  type: api
  notes: "Dashboard visibly exposes balance, bandwidth totals, residential and datacenter earnings, referral earnings, available funds, and pending balance. Docker client uses the UUID EARNFM_TOKEN from More -> Your API Key."
  credential_hint: "Use the API key shown under More -> Your API Key in <a href='https://app.earn.fm' target='_blank'>app.earn.fm</a>."

payout:
  model: internal
  notes: "Balance held by Earn.fm; withdrawn on request."
