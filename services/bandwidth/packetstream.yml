name: PacketStream
slug: packetstream
category: bandwidth
status: active
website: https://packetstream.io
description: >
  PacketStream is a peer-to-peer bandwidth marketplace where you can sell your
  unused bandwidth. It powers a residential proxy network used for market research,
  SEO monitoring, and ad verification. The current setup is a desktop client with
  a CID (Client ID) from the dashboard; automated earnings collection is still
  awkward because login is CAPTCHA-protected.
short_description: Residential proxy network - desktop app, CID setup

referral:
  signup_url: "https://packetstream.io/?psr=7xgZ"
  code: "7xgZ"

docker:
  image: packetstream/psclient
  platforms: [linux/amd64]
  resources:
    mem_limit: "128m"
    oom_score_adj: 300
  env:
    - key: CID
      label: "Client ID"
      required: true
      secret: false
      description: "Log in at <a href=\"https://packetstream.io/dashboard\">packetstream.io/dashboard</a> → click Setup in the sidebar → your CID is displayed in the Docker command"
  ports: []
  volumes: []
  command: ""
  network_mode: ""
  privileged: false

deploy:
  credentials:
    - key: cid
      label: "Client ID"
      kind: text
      secret: false
      required: true
      env: CID
      source: "PacketStream dashboard setup command"
      description: "CID shown in PacketStream's Docker setup command."

requirements:
  residential_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [paypal]
  minimum_payout: "$5"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 4
  currency: USD
  per: "device"
  notes: "Pays $0.10/GB for bandwidth shared. Earnings depend heavily on demand for your IP's location."

cashout:
  method: redirect
  dashboard_url: "https://packetstream.io/dashboard"
  min_amount: 5.0
  currency: USD

platforms: [docker, windows, macos, linux]

collector:
  type: scrape
  credentials:
    - key: auth_token
      label: "Auth cookie"
      kind: cookie
      secret: true
      required: true
      source: "PacketStream logged-in browser cookie"
      description: "auth cookie/JWT used by the earnings collector."
  notes: "Dashboard is CAPTCHA-protected. May need manual JWT from browser session for API access."
  credential_hint: "Log in at <a href='https://packetstream.io' target='_blank'>packetstream.io</a>, press F12 → Application → Cookies, copy the <b>auth</b> cookie value (it’s a JWT)."

payout:
  model: internal
  notes: "Balance held by PacketStream; withdrawn on request."
