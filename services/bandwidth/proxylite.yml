name: ProxyLite
slug: proxylite
category: bandwidth
status: active
website: https://proxylite.ru
description: >
  ProxyLite monetizes your internet traffic by sharing bandwidth with verified
  organizations. Works on both residential and VPS/datacenter connections. Simple
  setup requiring only a user ID from the dashboard. Offers a generous 15% lifetime
  referral commission.
short_description: Bandwidth sharing - 15% lifetime referral, works on VPS

referral:
  signup_url: "https://proxylite.ru/?r=KMUPRZIZ"
  code: "KMUPRZIZ"

docker:
  image: ""
  platforms: [linux/amd64, linux/arm64]
  resources:
    mem_limit: "128m"
    oom_score_adj: 300
  env: []
  ports: []
  volumes: []
  command: ""
  network_mode: ""

deploy:
  deploy_surface: host_systemd
  credentials:
    - key: user_id
      label: "PROXYLITE_USER_ID"
      kind: text
      secret: true
      required: true
      source: "ProxyLite dashboard"
      description: "Log in at lk.proxylite.ru; the User ID is shown on the main dashboard page next to your email."

requirements:
  residential_ip: false
  vps_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto, paypal]
  minimum_payout: "$5"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 3
  currency: USD
  per: "device"
  notes: "Residential IPs earn more. VPS/datacenter connections accepted at lower rates."

cashout:
  method: redirect
  dashboard_url: "https://proxylite.ru/dashboard"
  min_amount: 5.0
  currency: USD

platforms: [docker, windows, linux]

collector:
  type: manual
  notes: "Source runtime is host-systemd. Install.sh on the host accepts the user ID and starts the node outside Docker; CashPilot should only collect status/count until a host runner exists."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."
