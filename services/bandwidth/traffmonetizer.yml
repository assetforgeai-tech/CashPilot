name: Traffmonetizer
slug: traffmonetizer
category: bandwidth
status: active
website: https://traffmonetizer.com
description: >
  Traffmonetizer lets you monetize your internet traffic by sharing bandwidth with
  verified businesses. One of the few bandwidth-sharing services that works well on
  VPS and datacenter IPs in addition to residential connections. Uses a simple
  token-based authentication passed via command-line arguments. Supports ARM
  architectures for Raspberry Pi and similar devices.
short_description: Bandwidth sharing - works on VPS, token-based auth

referral:
  signup_url: "https://traffmonetizer.com/?aff=2111758"
  code: "2111758"

docker:
  image: traffmonetizer/cli_v2
  platforms: [linux/amd64, linux/arm64]
  resources:
    mem_limit: "128m"
    oom_score_adj: 300
  env:
    - key: TRAFFMONETIZER_TOKEN
      label: "Token"
      required: true
      secret: true
      description: "Log in at <a href=\"https://app.traffmonetizer.com/dashboard\">app.traffmonetizer.com/dashboard</a>, then copy <strong>Your application token</strong> from the dashboard card."
    - key: TRAFFMONETIZER_DEVICE_NAME
      label: "Device name"
      required: false
      secret: false
      description: "Name displayed in dashboard for device management"
      default: "{hostname}-tm"
  ports: []
  volumes: []
  command: "start accept --token ${TRAFFMONETIZER_TOKEN} --device-name ${TRAFFMONETIZER_DEVICE_NAME}"
  network_mode: ""
  privileged: false

deploy:
  credentials:
    - key: token
      label: "Token"
      kind: token
      secret: true
      required: true
      env: TRAFFMONETIZER_TOKEN
      source: "Traffmonetizer dashboard"
      description: "Token passed to the node runtime."

requirements:
  residential_ip: false
  devices_per_ip: 0
  note: "Traffmonetizer ToS requires residential IP, but VPS nodes are accepted in practice."
  note_column: vps_ip
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto, paypal]
  crypto_token: USDT
  minimum_payout: "$10"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 4
  currency: USD
  per: "device"
  notes: "VPS and datacenter IPs earn less than residential. US/EU locations earn more. Multiple IPs supported via Docker networks."

cashout:
  method: redirect
  dashboard_url: "https://app.traffmonetizer.com/dashboard"
  min_amount: 10.0
  currency: USD

platforms: [docker, windows, macos, android]

collector:
  type: api
  credentials:
    - key: email
      label: "Email"
      kind: email
      secret: false
      required: true
      source: "Traffmonetizer account"
      description: "Account email used by the earnings collector."
    - key: password
      label: "Password"
      kind: password
      secret: true
      required: true
      source: "Traffmonetizer account"
      description: "Account password used by the earnings collector."
  notes: "Collector logs in with email/password, then reads the balance API using the dashboard session token."
  credential_hint: "Enter your Traffmonetizer account email and password. Deploy still uses the dashboard's <strong>Your application token</strong>."

payout:
  model: internal
  notes: "USDT, but the CHAIN IS CHOSEN PER WITHDRAWAL (Arbitrum/Tron/Solana/TON), so there is no persistent on-chain identity to register."
