name: ProxyBase Markets
slug: proxybase-xyz
category: bandwidth
status: active
website: https://proxybase.xyz
description: >
  ProxyBase Markets is a SOCKS5 proxy marketplace built for AI agents. Sellers run
  a lightweight Rust CLI daemon that connects via WebSocket to relay buyer traffic
  through their internet connection, earning USDC on Tempo Chain per GB sold. Supports
  both direct (own bandwidth) and upstream (resell external proxies) modes with
  auto-reconnect. Buyers purchase proxy sessions by country, ISP, and bandwidth.
  Payments flow through the Micropayments Protocol (MPP) on Tempo Chain.
short_description: proxybase.xyz - SOCKS5 marketplace for AI agents, USDC payout. Imports a server-managed wallet phrase on each worker node

referral:
  signup_url: "https://proxybase.xyz?referral=nXzS3c6iTO"
  code: "nXzS3c6iTO"

docker:
  image: "ubuntu:24.04"
  platforms: [linux/amd64, linux/arm64]
  resources:
    mem_limit: "128m"
    oom_score_adj: 300
  env:
    - key: BACKEND_URL
      label: "Backend API URL"
      required: false
      secret: false
      description: "Override the backend API URL (defaults to https://api.proxybase.xyz)"
      default: "https://api.proxybase.xyz"
  ports: []
  volumes:
    - "proxybase-xyz-data:/home/proxybase/.proxybase"
  command: >-
    sh -lc 'set -e; CLI="$(command -v proxybase-cli || true)"; if [ -z "$CLI" ]; then for p in "$HOME/.local/bin/proxybase-cli" "/root/.local/bin/proxybase-cli" "/usr/local/bin/proxybase-cli"; do if [ -x "$p" ]; then CLI="$p"; break; fi; done; fi; if [ -z "$CLI" ]; then echo "proxybase-cli not found" >&2; exit 1; fi; PHASE="${PROXYBASE_XYZ_PHRASE:?missing wallet phrase}"; "$CLI" wallet import "$PHASE"; "$CLI" login; if [ ! -s /home/proxybase/.proxybase/seller_config.json ]; then printf "{\"upstream_proxies\":[],\"no_direct\":false}" > /home/proxybase/.proxybase/seller_config.json; fi; "$CLI" seller start; touch /home/proxybase/.proxybase/seller.log; tail -n +1 -F /home/proxybase/.proxybase/seller.log'
  network_mode: ""
  setup: >
    CashPilot builds a local image with the official Linux CLI, imports the configured
    wallet phrase at runtime with <code>proxybase-cli wallet import</code>, runs
    <code>proxybase-cli login</code>, then starts selling bandwidth with
    If the seller config is missing in the volume, CashPilot seeds the direct-mode
    default before <code>seller start</code>, then keeps the container alive by
    following the seller log. No dashboard token is required.

deploy:
  credentials:
    - key: phrase
      label: "Wallet phrase"
      kind: text
      secret: true
      required: true
      durable: true
      source: "ProxyBase Markets wallet"
      description: "Mnemonic/phrase imported on worker deploy; stored only as a CashPilot deploy credential."

requirements:
  residential_ip: false
  vps_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  crypto_token: "USDC"
  minimum_payout: "$1"
  currency: USDC
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 15
  currency: USD
  per: "device"
  notes: "Earnings based on GB sold at market rates. VPS/datacenter IPs earn less than residential. Multi-upstream mode can combine your own bandwidth with external proxies."

cashout:
  method: manual
  dashboard_url: "https://proxybase.xyz"
  min_amount: 1.0
  currency: USD
  notes: "Lock earnings via <code>proxybase-cli seller payout create</code>, received as USDC on Tempo Chain (Tempo MPP). Requires a Tempo wallet address."

platforms: [docker, linux, macos, windows]

collector:
  type: manual
  notes: "REST API at api.proxybase.xyz (GET /v2/seller/status, GET /v2/wallet/balance). Auth uses ECDSA challenge-response with secp256k1 wallet — feasible to automate but non-trivial."

# What this service does with the user's machine (CashPilot-66x).
# Written to be read by someone deciding whether to trust it.
disclosure:
  sells: >-
    Bandwidth, as a SOCKS5 proxy sold to buyers on the ProxyBase marketplace.
  third_party_traffic: >-
    Yes. Buyers route their traffic through your connection — that is exactly
    what is being sold.
  data_collected: >-
    A wallet phrase imported on your machine, plus the traffic volume you
    relay.
  isp_risk: >-
    Real, and it applies directly to home connections. Proxy traffic from
    unknown buyers exits under your IP, so abuse complaints arrive at your
    door. Nothing in this catalog restricts the service to datacentre
    addresses, and residential IPs earn more, so the incentive points the
    wrong way here: read your ISP's terms before running it at home.
  account_rules: >-
    unknown - the provider does not publish a per-account or per-IP device
    limit, and the catalog does not declare one.

payout:
  model: external
  address_source: manual
  notes: "CashPilot imports the operator-provided wallet phrase before login; there is no generated throwaway wallet to back up."
