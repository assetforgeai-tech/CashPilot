name: Bytelixir
slug: bytelixir
category: bandwidth
status: active
website: https://bytelixir.com
description: >
  Bytelixir lets you earn passive income by sharing unused internet bandwidth.
  Current public pages advertise Windows and Android apps, a 50 Mbps connection
  requirement, and web dashboard tracking at dash.bytelixir.com. No Docker image
  or public earnings API is available.
short_description: Bandwidth sharing - Windows/Android app, 50 Mbps minimum

referral:
  signup_url: "https://bytelixir.com/r/OYEIRE0VSZBZ"
  code: "OYEIRE0VSZBZ"

docker:
  image: ""
  platforms: []
  env:
    - key: BYTELIXIR_SESSION_COOKIE
      label: "Session Cookie"
      required: true
      secret: true
      description: "Log in at <a href=\"https://dash.bytelixir.com\">dash.bytelixir.com</a>, press F12 → Application → expand <b>Cookies</b> in the left sidebar → click the sub-item <code>https://dash.bytelixir.com</code> → in the cookie list on the right, find <code>bytelixir_session</code> → copy its Value (a long JWT starting with eyJ)"
    - key: BYTELIXIR_REMEMBER_WEB
      label: "Remember Web Cookie"
      required: false
      secret: true
      description: "Same location (Cookies → <code>https://dash.bytelixir.com</code>) → find the cookie named <code>remember_web_...</code> → copy its Value (optional, extends session lifetime)"
    - key: BYTELIXIR_XSRF_TOKEN
      label: "XSRF Token"
      required: false
      secret: true
      description: "Same location → find <code>XSRF-TOKEN</code> → copy its Value (optional)"
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: true
  min_bandwidth: "50 Mbps"
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: "$2"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 2
  monthly_high: 10
  currency: USD
  per: "device"
  notes: "Official public pages describe typical single-device earnings around $2-10/month. Windows or Android app required; no Docker image."

cashout:
  method: redirect
  dashboard_url: "https://dash.bytelixir.com"
  min_amount: 2.0
  currency: USD

platforms: [windows, android]

collector:
  type: manual
  notes: "No public API. Dashboard at dash.bytelixir.com uses email/password auth. Scraping possible."
  credential_hint: "Log in at <a href='https://dash.bytelixir.com' target='_blank'>dash.bytelixir.com</a> <b>ticking Remember Me</b>, press F12 → Application → expand <b>Cookies</b> in the left sidebar → click <code>https://dash.bytelixir.com</code>, then copy three values: <b>bytelixir_session</b>, <b>remember_web_…</b> (the long one starting with that prefix) and <b>XSRF-TOKEN</b>. The session cookie alone expires about two hours after you copy it, so collection stops the same afternoon; the remember_web cookie lasts a year and is what keeps it working."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."
