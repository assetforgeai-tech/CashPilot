name: Titan Network
slug: titan
category: depin
status: active
website: https://titannet.io
description: >
  Titan Network Edge currently earns through a browser-extension dashboard that
  tracks device uptime, IP quality, task earnings, TNTIP points, and USDC task
  rewards. The logged-in dashboard shows per-device and daily earnings.
short_description: Browser-extension DePIN tasks - TNTIP/USDC rewards

referral:
  signup_url: "https://edge.titannet.info/signup?inviteCode=2GKKJ495"
  code: "2GKKJ495"

docker:
  image: ""
  platforms: [browser-extension]
  env: []
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  crypto_token: USDC
  minimum_payout: ""
  currency: USDC
  frequency: "Dashboard withdrawal when available"

earnings:
  monthly_low: 0
  monthly_high: 30
  currency: USD
  per: "device"
  notes: "Dashboard shows TNTIP uptime points plus USDC task rewards. Extension must be enabled; paused extension stops earnings."

cashout:
  method: manual
  dashboard_url: "https://edge.titannet.info/dashboard"
  # Undocumented: the provider does not publish a minimum. NOT 0 -
  # 0 means 'no minimum, cash out anything', which would tell the
  # user they can withdraw now and disables payout detection.
  min_amount: null
  currency: USDC
  notes: "Logged-in dashboard exposes Pending Withdraw USDC and Pending Audit USDC. Minimum was not visible in the audited account."

platforms: [browser-extension]

collector:
  type: scrape
  notes: "Logged-in dashboard exposes account totals, per-device rows, and earnings history. No public API contract confirmed."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."
