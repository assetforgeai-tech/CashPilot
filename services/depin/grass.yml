name: Grass
slug: grass
category: depin
status: active
website: https://www.grass.io
description: >
  Grass is a decentralized network that lets you sell your unused bandwidth for
  AI training data. It operates as a browser extension and desktop app, routing
  web scraping requests through your connection to build structured datasets.
  With 8.5M+ users, it is one of the largest DePIN bandwidth networks. Earns
  GRASS tokens on the Solana blockchain.
short_description: DePIN bandwidth sharing for AI data - earns GRASS tokens

referral:
  signup_url: "https://app.grass.io/register?referralCode=kn8FNEPnUr2tMqE"
  code: "kn8FNEPnUr2tMqE"

docker:
  image: cashpilot/grass-desktop:auto
  platforms: [linux/amd64]
  resources:
    mem_limit: "768m"
    oom_score_adj: 300
  env: []
  ports:
    - "6080:6080"
  volumes:
    - "grass-profile:/var/lib/grass-xdg"
  command: ""
  network_mode: ""

deploy:
  automation: store_json_patch
  installer_manifest_url: "https://files.grass.io/file/grass-extension-upgrades/v7.6.0/grass-desktop_7.6.0_amd64.deb"
  installer_platform: "linux-x86_64"
  notes: "Runtime builds the official Grass Desktop Linux .deb wrapper, waits for store.json, patches only the logged-in auth seed, then restarts Grass."
  credentials:
    - key: store_access_token
      label: "store.json accessToken"
      kind: token
      secret: true
      required: true
      source: "Logged-in Grass Desktop store.json"
      description: "Copy the exact accessToken value from a confirmed logged-in and connected seed."
    - key: store_refresh_token
      label: "store.json refreshToken"
      kind: token
      secret: true
      required: true
      source: "Logged-in Grass Desktop store.json"
      description: "Copy the exact refreshToken value from a confirmed logged-in and connected seed."
    - key: store_token_expiry
      label: "store.json tokenExpiry"
      kind: text
      secret: true
      required: true
      source: "Logged-in Grass Desktop store.json"
      description: "Copy the exact tokenExpiry value from a confirmed logged-in and connected seed."
    - key: store_wynd_status
      label: "store.json wynd:status"
      kind: text
      secret: true
      required: true
      source: "Logged-in Grass Desktop store.json"
      description: "Copy the exact wynd:status value from a confirmed connected seed."
    - key: store_wynd_authenticated
      label: "store.json wynd:authenticated"
      kind: text
      secret: true
      required: true
      source: "Logged-in Grass Desktop store.json"
      description: "Copy the exact wynd:authenticated value from a confirmed logged-in and connected seed."
    - key: store_wynd_user_id
      label: "store.json wynd:user_id"
      kind: text
      secret: true
      required: true
      source: "Logged-in Grass Desktop store.json"
      description: "Copy the exact wynd:user_id value from a confirmed logged-in and connected seed."
    - key: store_auto_update
      label: "store.json autoUpdate"
      kind: text
      secret: true
      required: true
      source: "Logged-in Grass Desktop store.json"
      description: "Copy the exact autoUpdate value from a confirmed connected seed."

requirements:
  residential_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: ""
  currency: GRASS
  frequency: "Epoch-based airdrop"

earnings:
  monthly_low: 0
  monthly_high: 10
  currency: USD
  per: "device"
  notes: "Earns Grass Points convertible to GRASS tokens via airdrops. Actual USD value depends on token price. Browser extension or desktop app required."

cashout:
  method: redirect
  dashboard_url: "https://app.grass.io/dashboard"
  # Undocumented: the provider does not publish a minimum. NOT 0 -
  # 0 means 'no minimum, cash out anything', which would tell the
  # user they can withdraw now and disables payout detection.
  min_amount: null
  currency: GRASS
  notes: "GRASS token airdrop-based. Claim from dashboard when eligible."

platforms: [browser-extension, windows, macos, linux, android, ios]

collector:
  type: api
  notes: "Dashboard API at app.grass.io. Auth via accessToken. Runtime login uses the seeded Grass Desktop store identity separately."
  credentials:
    - key: access_token
      label: "Access Token"
      kind: token
      secret: true
      required: true
      source: "Grass dashboard local storage accessToken"
      description: "Copy a fresh accessToken from the logged-in Grass dashboard or desktop profile. Runtime seed bundles stay outside the repo."
  credential_hint: "Log in at <a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a>, press F12 -> Application -> Local Storage, copy the <b>accessToken</b> value."

dashboard:
  credentials:
    - key: grass_store_access_token
      label: "Access token"
      kind: token
      secret: true
      required: false
      source: "Grass local storage"
    - key: grass_store_refresh_token
      label: "Refresh token"
      kind: token
      secret: true
      required: false
      source: "Grass local storage"
    - key: grass_store_token_expiry
      label: "Token expiry"
      kind: text
      secret: true
      required: false
      source: "Grass local storage"
    - key: grass_store_wynd_status
      label: "Wynd status"
      kind: text
      secret: true
      required: false
      source: "Grass local storage"
    - key: grass_store_wynd_authenticated
      label: "Wynd authenticated"
      kind: text
      secret: true
      required: false
      source: "Grass local storage"
    - key: grass_store_wynd_user_id
      label: "Wynd user ID"
      kind: text
      secret: true
      required: false
      source: "Grass local storage"
    - key: grass_store_auto_update
      label: "Auto update"
      kind: text
      secret: true
      required: false
      source: "Grass local storage"
    - key: grass_store_wynd_browser_id
      label: "Browser ID"
      kind: text
      secret: true
      required: false
      source: "Grass local storage"
    - key: grass_store_wynd_device_privkey
      label: "Device private key"
      kind: text
      secret: true
      required: false
      source: "Grass local storage"
    - key: grass_store_wynd_device_pubkey
      label: "Device public key"
      kind: text
      secret: true
      required: false
      source: "Grass local storage"
    - key: grass_store_wynd_device_id
      label: "Device ID"
      kind: text
      secret: true
      required: false
      source: "Grass local storage"
    - key: grass_store_wynd_device_registered_pubkey
      label: "Registered public key"
      kind: text
      secret: true
      required: false
      source: "Grass local storage"
    - key: grass_store_wynd_device_registered_user_id
      label: "Registered user ID"
      kind: text
      secret: true
      required: false
      source: "Grass local storage"

payout:
  model: internal
  notes: "Accrues POINTS; GRASS is claimed from the Grass dashboard during periodic airdrops."
