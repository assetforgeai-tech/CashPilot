name: Grass
slug: grass
category: depin
status: active
website: https://www.grass.io
description: >
  Grass is a decentralized network that lets you sell your unused bandwidth for
  AI training data. It operates as a browser extension and desktop app, routing
  web scraping requests through your connection to build structured datasets.
  With 8.5M+ users, it is one of the largest DePIN bandwidth networks. Earns
  GRASS tokens on the Solana blockchain.
short_description: DePIN bandwidth sharing for AI data - earns GRASS tokens

referral:
  signup_url: "https://app.grass.io/register?referralCode=kn8FNEPnUr2tMqE"
  code: "kn8FNEPnUr2tMqE"

docker:
  image: cashpilot/grass-desktop:auto
  platforms: [linux/amd64]
  resources:
    mem_limit: "768m"
    oom_score_adj: 300
  env: []
  ports:
    - "5900:5900"
    - "6080:6080"
  volumes: []
  command: ""
  network_mode: ""

deploy:
  automation: official_deb_seed_profile
  installer_manifest_url: "https://files.grass.io/file/grass-extension-upgrades/desktop-installer-latest.json"
  notes: "Runtime builds the official Grass Desktop Linux package and seeds the logged-in desktop profile bundle when present. Email/password stay available for manual fallback. Collector still uses the Grass dashboard accessToken."
  runtime_assets:
    - provider: grass
      asset_kind: seed_bundle
      target: /cashpilot/runtime-assets/grass/profile.tar.gz
      encoding: base64
  credentials:
    - key: email
      label: "Email"
      kind: email
      secret: true
      required: true
      source: "Grass account"
      env: USER_EMAIL
      description: "Grass account email used by the desktop Docker runtime."
    - key: password
      label: "Password"
      kind: password
      secret: true
      required: true
      source: "Grass account"
      env: USER_PASSWORD
      description: "Grass account password used by the desktop Docker runtime."

requirements:
  residential_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: ""
  currency: GRASS
  frequency: "Epoch-based airdrop"

earnings:
  monthly_low: 0
  monthly_high: 10
  currency: USD
  per: "device"
  notes: "Earns Grass Points convertible to GRASS tokens via airdrops. Actual USD value depends on token price. Browser extension or desktop app required."

cashout:
  method: redirect
  dashboard_url: "https://app.grass.io/dashboard"
  # Undocumented: the provider does not publish a minimum. NOT 0 -
  # 0 means 'no minimum, cash out anything', which would tell the
  # user they can withdraw now and disables payout detection.
  min_amount: null
  currency: GRASS
  notes: "GRASS token airdrop-based. Claim from dashboard when eligible."

platforms: [browser-extension, windows, macos, linux, android, ios]

collector:
  type: api
  notes: "Dashboard API at app.grass.io. Auth via accessToken. Runtime login uses email/password separately."
  credentials:
    - key: access_token
      label: "Access Token"
      kind: token
      secret: true
      required: true
      source: "Grass dashboard local storage accessToken"
      description: "Copy a fresh accessToken from the logged-in Grass dashboard or desktop profile. Runtime seed bundles stay outside the repo."
  credential_hint: "Log in at <a href='https://app.getgrass.io' target='_blank'>app.getgrass.io</a>, press F12 -> Application -> Local Storage, copy the <b>accessToken</b> value."

dashboard:
  credentials:
    - key: grass_store_wynd_status
      label: "Wynd status"
      kind: text
      secret: false
      required: false
      source: "Grass local storage"
    - key: grass_store_wynd_user_id
      label: "Wynd user ID"
      kind: text
      secret: false
      required: false
      source: "Grass local storage"
    - key: grass_store_token_expiry
      label: "Token expiry"
      kind: text
      secret: false
      required: false
      source: "Grass local storage"
    - key: grass_store_auto_update
      label: "Auto update"
      kind: text
      secret: false
      required: false
      source: "Grass local storage"
    - key: grass_store_wynd_authenticated
      label: "Wynd authenticated"
      kind: text
      secret: false
      required: false
      source: "Grass local storage"
    - key: grass_store_refresh_token
      label: "Refresh token"
      kind: token
      secret: true
      required: false
      source: "Grass local storage"
    - key: grass_store_access_token
      label: "Access token"
      kind: token
      secret: true
      required: false
      source: "Grass local storage"

payout:
  model: internal
  notes: "Accrues POINTS; GRASS is claimed from the Grass dashboard during periodic airdrops."
