name: Wipter
slug: wipter
category: depin
status: active
website: https://wipter.com
description: >
  Wipter is a bandwidth sharing platform available on Windows, Mac, Linux, and
  Android. It claims to pay up to $1/GB of shared bandwidth with a minimum payout
  threshold of $20. The platform operates similarly to traditional bandwidth
  sharing apps, routing legitimate traffic through residential connections.
short_description: Bandwidth sharing - claims up to $1/GB, min payout $20

referral:
  signup_url: "https://wipter.com/en/refer-a-friend"

docker:
  image: ghcr.io/techroy23/docker-wipter:latest
  user: root
  platforms: [linux/amd64]
  resources:
    mem_limit: "512m"
    oom_score_adj: 300
  env:
    - key: WIPTER_EMAIL
      label: "Email"
      required: false
      secret: false
      description: "Wipter account email. The tested container performs login itself and persists its token/keyring."
    - key: WIPTER_PASSWORD
      label: "Password"
      required: false
      secret: true
      description: "Wipter account password. Prefer a dedicated account; no payout/security settings are touched by CashPilot."
  ports: []
  volumes:
    - "wipter-data:/root/.config/wipter-app"
  command: ""
  network_mode: ""
  health_signals:
    - pattern: "LOGIN_SUCCESS|Saving new token|Credential stored for service: com\\.wipter\\.auth\\.production|Wipter setup complete"
      means: "Wipter accepted the account and saved login state."
      state: idle
    - pattern: "<<< PONG|Request ID|Upload:|Download:|SOCKS.*Connection established|HTTPS.*Request ID"
      means: "Wipter is exchanging traffic."
      state: idle

deploy:
  automation: env_login
  notes: "Container logs in with WIPTER_EMAIL/WIPTER_PASSWORD, persists token/keyring, then can be restarted once after login-ready markers."
  credentials:
    - key: email
      label: "Wipter email"
      kind: email
      secret: false
      required: true
      source: "Wipter account"
      description: "Mapped to WIPTER_EMAIL for the tested Docker runtime."
    - key: password
      label: "Wipter password"
      kind: password
      secret: true
      required: true
      source: "Wipter account"
      description: "Mapped to WIPTER_PASSWORD. Prefer a dedicated account; CashPilot does not touch payout or security settings."

requirements:
  residential_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [paypal, crypto]
  minimum_payout: "$20"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 10
  currency: USD
  per: "device"
  notes: "Claims up to $1/GB but real-world earnings are lower. Minimum payout $20. Earnings vary heavily by location and demand."

cashout:
  method: redirect
  dashboard_url: "https://wipter.com/dashboard"
  min_amount: 20.0
  currency: USD
  notes: "Cashout only visible in desktop app. No web dashboard payout."

platforms: [docker, windows, macos, linux, android]

collector:
  type: manual
  notes: "Node-count/status only. No public earnings API documented; runtime login and traffic markers come from worker heartbeat/provider state."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."
