name: Uprock
slug: uprock
category: depin
status: active
website: https://uprock.com
description: >
  Uprock is a DePIN (Decentralized Physical Infrastructure Network) platform that
  lets you earn cryptocurrency by sharing your internet connection. The tested
  automation uses a pre-authenticated seed/profile bundle for the desktop/browser
  runtime rather than email/password login at container start.
short_description: DePIN internet sharing - crypto payout, browser extension primary

referral:
  signup_url: "https://link.uprock.com/i/33e8492e"
  code: "33e8492e"

docker:
  image: ghcr.io/assetforgeai-tech/internetincome-uprock:0.0.38-browser
  platforms: [linux/amd64]
  resources:
    mem_limit: "768m"
    oom_score_adj: 300
  env: []
  ports: []
  volumes:
    - "uprock-profile:/data/profile"
  command: ""
  network_mode: ""
  health_signals:
    - pattern: "earning|work|pass"
      means: "Uprock runtime is logged in and work-capable."
      state: idle
    - pattern: "logged.?out|update.?required|login required"
      means: "Uprock seed/profile is invalid or app version changed."
      state: error

deploy:
  automation: seed_bundle
  notes: "Runtime uses a pre-authenticated full seed bundle or credentials.json + main-enabled.db bundle."
  credentials:
    - key: seed_bundle
      label: "Uprock seed bundle"
      kind: file
      secret: true
      required: true
      source: "CashPilot runtime asset inventory"
      description: "Redacted Uprock profile seed; worker requests it by runtime asset API."

requirements:
  residential_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: "$5"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 5
  currency: USD
  per: "device"
  notes: "Crypto/token-based earnings. The tested Docker automation is seed/profile based; CashPilot does not yet model seed bundle mounts."

cashout:
  method: redirect
  dashboard_url: "https://uprock.com"
  min_amount: 5.0
  currency: USD
  notes: "Crypto token-based rewards. Claim from dashboard."

platforms: [browser-extension, android]

collector:
  type: manual
  notes: "No public earnings API confirmed. Runtime evidence points to a seed/profile based app container, not env email/password login."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."
