name: Uprock
slug: uprock
category: depin
status: active
website: https://uprock.com
description: >
  Uprock is a DePIN (Decentralized Physical Infrastructure Network) platform that
  lets you earn cryptocurrency by sharing your internet connection. The tested
  automation uses a pre-authenticated seed/profile bundle for the desktop/browser
  runtime rather than email/password login at container start.
short_description: DePIN internet sharing - crypto payout, browser extension primary

referral:
  signup_url: "https://link.uprock.com/i/33e8492e"
  code: "33e8492e"

docker:
  image: cashpilot/uprock-mining:auto
  platforms: [linux/amd64]
  resources:
    mem_limit: "768m"
    oom_score_adj: 300
  env: []
  ports: []
  volumes:
    - "uprock-state:/root/.local/share/UpRock"
  command: ""
  network_mode: ""
  health_signals:
    - pattern: "earning|work|pass"
      means: "Uprock runtime is logged in and work-capable."
      state: idle
    - pattern: "logged.?out|update.?required|login required"
      means: "Uprock seed/profile is invalid or app version changed."
      state: error

deploy:
  automation: official_deb_seed_state
  installer_manifest_url: "https://edge.uprock.com/v1/app-download/UpRock-Mining-v0.0.38.deb"
  installer_platform: linux-x86_64
  notes: "Runtime uses the official UpRock Linux .deb plus a preseeded credentials.json + main.db state bundle."
  runtime_assets:
    - provider: uprock
      asset_kind: credentials_json
      target: /cashpilot/runtime-assets/uprock/credentials.json
      encoding: text
    - provider: uprock
      asset_kind: main_db
      target: /cashpilot/runtime-assets/uprock/main.db
      encoding: base64
  credentials:
    - key: credentials_json
      label: "Uprock credentials.json"
      kind: file
      secret: true
      required: true
      source: "CashPilot runtime asset inventory"
      description: "Redacted Uprock login seed; worker requests it by runtime asset API."
    - key: main_db
      label: "Uprock main.db"
      kind: file
      secret: true
      required: true
      source: "CashPilot runtime asset inventory"
      description: "Redacted Uprock app state database; worker requests it by runtime asset API."

requirements:
  residential_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: "$5"
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 5
  currency: USD
  per: "device"
  notes: "Crypto/token-based earnings. The tested Docker automation uses the official Linux .deb plus preseeded login/state files."

cashout:
  method: redirect
  dashboard_url: "https://uprock.com"
  min_amount: 5.0
  currency: USD
  notes: "Crypto token-based rewards. Claim from dashboard."

platforms: [browser-extension, android]

collector:
  type: manual
  notes: "No public earnings API confirmed. Worker heartbeat records local daemon evidence (authenticated, earning, earn_rate, version, device_id) but does not import wallet totals or payout history."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."
