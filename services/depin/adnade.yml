name: Adnade
slug: adnade
category: depin
status: active
website: https://adnade.net
description: >
  Adnade is a browser-based earning flow that opens a logged-in Chrome profile
  at the provider's view page. CashPilot uses the official Chromium container
  plus a pre-authenticated Chrome profile bundle that already contains Dawn and
  Titan extensions.
short_description: Browser-based Adnade flow using Chromium and a seeded Chrome profile

docker:
  image: lscr.io/linuxserver/chromium:latest
  platforms: [linux/amd64]
  resources:
    mem_limit: "768m"
    oom_score_adj: 300
  env: []
  ports: ["4000:3000"]
  volumes: []
  command: ""
  network_mode: ""

deploy:
  automation: chromium_profile
  runtime_assets:
    - provider: adnade
      asset_kind: chrome_profile_zip
      target: /config
      encoding: zip
      url: https://adnade.acacondos.com/cashpilot/adnade/chromeprofiledata.ORIGINAL.zip.fernet
      sha256: 945ebf2a6ddf926804542d83bf187bbf078d60031d2247f82227f3e6cc80845d
      decrypt: fernet
      decrypt_key_arg: chrome_profile_key
  credentials:
    - key: username
      label: "Adnade username"
      kind: text
      secret: false
      required: true
      source: "Adnade account"
      description: "The user value passed to adnade.net/view.php."
    - key: chrome_profile_key
      label: "Chrome profile decrypt key"
      kind: token
      secret: true
      required: true
      source: "CashPilot secret inventory"
      description: "Fernet key for the encrypted Chrome profile artifact."

requirements:
  residential_ip: false
  vps_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: ""
  currency: USD
  frequency: "On request"

earnings:
  monthly_low: 0
  monthly_high: 0
  currency: USD
  per: "device"
  notes: "Browser-based flow. Earnings and node mechanics still need live validation."

cashout:
  method: redirect
  dashboard_url: "https://adnade.net"
  min_amount: null
  currency: USD
  notes: "Account/dashboard specifics still under audit."

platforms: [browser-extension, linux]

collector:
  type: scrape
  credentials:
    - key: username
      label: "Adnade username"
      kind: text
      secret: false
      required: true
      source: "Adnade account"
      description: "Username used to log in to Adnade for earnings collection."
    - key: password
      label: "Adnade password"
      kind: password
      secret: true
      required: true
      source: "Adnade account"
      description: "Password used to log in and read withdrawable balance."
  balance_url: "https://adnade.net/login.php?page=paid4use&navaction=auszahlung"
  notes: "Logs in with UserID/Passwort and reads the current withdrawable EUR balance."

payout:
  model: account_balance
  notes: "Withdrawable balance is shown on the EUR/BTC payout page."
