name: Nodepay
slug: nodepay
category: depin
status: active
website: https://nodepay.ai
description: >
  Nodepay is a real-time intelligence platform that rewards contributors for
  providing signals and participation. The public site now centers on the app
  and dashboard rather than a browser-extension-first flow. Rewards, referrals,
  and contributions are tracked in the web dashboard.
short_description: Signals and rewards platform - mobile app + dashboard

referral:
  signup_url: "https://app.nodepay.ai/register?ref=0wzzyznen64j9zx"
  code: "0wzzyznen64j9zx"

docker:
  image: ""
  platforms: [browser-extension]
  env: []
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: true
  min_bandwidth: ""
  gpu: false
  min_storage: ""

payment:
  methods: [crypto]
  minimum_payout: ""
  currency: NC
  frequency: "Token airdrop (TBA)"

earnings:
  monthly_low: 0
  monthly_high: 5
  currency: USD
  per: "device"
  notes: "Earns Nodepay Points pre-token launch. Cloudflare protection may block automated collection. Browser extension required."

cashout:
  method: redirect
  dashboard_url: "https://app.nodepay.ai/dashboard"
  # Undocumented: the provider does not publish a minimum. NOT 0 —
  # 0 means 'no minimum, cash out anything', which would tell the
  # user they can withdraw now and disables payout detection.
  min_amount: null
  currency: NC
  notes: "Points-based system. Token conversion TBD."

platforms: [android, ios]

collector:
  type: scrape
  notes: "Dashboard at app.nodepay.ai. Public access is app/dashboard-shaped; automated collection may need browser session cookies."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."
