name: Golem Network
slug: golem
category: compute
status: active
website: https://golem.network
description: >
  Golem Network is a decentralized compute marketplace where you share CPU and
  GPU resources in exchange for GLM tokens. Providers run the Yagna agent which
  manages workload execution in sandboxed environments. One of the oldest
  decentralized compute projects (founded 2016). Current provider docs favor a
  host Docker-based provider install, but CashPilot does not package it as a
  single managed service container. Payments are in GLM.
short_description: Decentralized compute marketplace - GLM tokens via Yagna agent

referral:
  signup_url: "https://golem.network"
  program: false

docker:
  image: ""
  platforms: [linux/amd64]
  env: []
  ports: []
  volumes: []
  command: ""
  network_mode: ""

requirements:
  residential_ip: false
  min_bandwidth: "10 Mbps"
  gpu: false
  min_storage: "20GB"

payment:
  methods: [crypto]
  minimum_payout: ""
  currency: GLM
  frequency: "Per task completion"

earnings:
  monthly_low: 0
  monthly_high: 50
  currency: USD
  per: "device"
  notes: "Earnings depend on hardware, pricing, and task demand. Current provider setup is a host-level Golem/Yagna provider install, commonly Docker-based, not a single CashPilot-managed image."

cashout:
  method: redirect
  dashboard_url: "https://stats.golem.network"
  # Undocumented: the provider does not publish a minimum. NOT 0 —
  # 0 means 'no minimum, cash out anything', which would tell the
  # user they can withdraw now and disables payout detection.
  min_amount: null
  currency: GLM
  notes: "GLM tokens earned. Configure payout wallet in provider setup."

platforms: [linux]

collector:
  type: api
  notes: "Local Yagna REST API at localhost:7465. Provider earnings can be queried from Yagna/payment state once the host provider is installed."

payout:
  model: unknown
  notes: "Not yet determined. Flagged rather than shown blank -- see CashPilot-luj."
