name: Docker Hub Description

on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      can_sync: ${{ steps.check.outputs.can_sync }}
    steps:
      - id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "can_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_sync=false" >> "$GITHUB_OUTPUT"
          fi

  update-description:
    needs: check-secrets
    if: needs.check-secrets.outputs.can_sync == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync UI Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: drumsergio/cashpilot

      - name: Sync worker Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: drumsergio/cashpilot-worker
          short-description: "CashPilot worker — Docker agent that deploys and monitors passive-income service containers (pairs with the drumsergio/cashpilot UI)."
