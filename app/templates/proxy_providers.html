{% extends "base.html" %}
{% block title %}Proxy provider - CashPilot{% endblock %}
{% block page %}proxy-providers{% endblock %}
{% block topbar_title %}Proxy provider{% endblock %}
{% block content %}
<section class="content-section">
  <div class="section-header">
    <h2>Proxy provider</h2>
  </div>
  <form id="provider-form" class="settings-grid">
    <div class="form-group">
      <label class="form-label" for="provider-name">Name</label>
      <input class="form-input" id="provider-name" value="vtproxy" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="provider-type">Type</label>
      <select class="form-input" id="provider-type">
        <option value="vtproxy">Vtproxy</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label" for="provider-base-url">Base URL</label>
      <input class="form-input" id="provider-base-url" value="https://vtproxy.net">
    </div>
    <div class="form-group">
      <label class="form-label" for="provider-api-key">API key</label>
      <input class="form-input" id="provider-api-key" type="password" autocomplete="off">
    </div>
    <button class="btn btn-primary" type="submit">Save</button>
  </form>
  <div class="table-wrap">
    <table class="data-table">
      <thead><tr><th>Name</th><th>Type</th><th>API key</th><th>Last sync</th><th></th></tr></thead>
      <tbody id="provider-rows"></tbody>
    </table>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script nonce="{{ csp_nonce(request) }}">
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function loadProviders() {
  const rows = await fetch('/api/proxy-providers').then(r => r.json());
  document.getElementById('provider-rows').innerHTML = rows.map(p => `
    <tr>
      <td>${esc(p.name)}</td><td>${esc(p.type)}</td><td>${p.api_key_set ? 'set' : 'missing'}</td>
      <td>${esc(p.last_synced_at || '-')}</td>
      <td><button class="btn btn-sm btn-secondary" data-sync="${p.id}">Sync</button></td>
    </tr>`).join('');
}
document.getElementById('provider-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  await fetch('/api/proxy-providers', {
    method: 'POST',
    headers: {'content-type': 'application/json'},
    body: JSON.stringify({
      name: document.getElementById('provider-name').value,
      type: document.getElementById('provider-type').value,
      base_url: document.getElementById('provider-base-url').value,
      api_key: document.getElementById('provider-api-key').value
    })
  });
  document.getElementById('provider-api-key').value = '';
  loadProviders();
});
document.getElementById('provider-rows').addEventListener('click', async (ev) => {
  const id = ev.target.dataset.sync;
  if (!id) return;
  await fetch(`/api/proxy-providers/${id}/sync`, {method: 'POST'});
  loadProviders();
});
loadProviders();
</script>
{% endblock %}
